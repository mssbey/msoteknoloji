databases:
  - name: mso-teknoloji-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: mso-teknoloji-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "MSO Teknoloji"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: en_US
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: mso-teknoloji-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mso-teknoloji-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mso-teknoloji-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mso-teknoloji-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mso-teknoloji-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtps
      - key: MAIL_HOST
        value: smtp.yandex.com.tr
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USERNAME
        value: info@msoteknoloji.com.tr
      # Yandex uygulama şifresi; Render panelinden girilir, repoya yazılmaz.
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: info@msoteknoloji.com.tr
      - key: MAIL_FROM_NAME
        value: MSO Teknoloji
      - key: FRONTEND_URL
        value: https://www.msoteknoloji.com
      # Yönetim paneli girişi; Render panelinden girilir, repoya yazılmaz.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: KARGONOMI_ENABLED
        value: "true"
      - key: KARGONOMI_API_TOKEN
        sync: false
      - key: KARGONOMI_WEBHOOK_SECRET
        sync: false
      - key: KARGONOMI_WAREHOUSE_ID
        sync: false
      - key: SENTOS_ENABLED
        value: "true"
      - key: SENTOS_BASE_URL
        sync: false
      - key: SENTOS_API_KEY
        sync: false
      - key: SENTOS_API_SECRET
        sync: false
      - key: SENTOS_WEBHOOK_SECRET
        sync: false
      - key: SENTOS_VERIFY_SSL
        value: "true"
