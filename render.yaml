databases:
  - name: mso-teknoloji-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: mso-teknoloji-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "MSO Teknoloji"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: en_US
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: mso-teknoloji-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mso-teknoloji-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mso-teknoloji-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mso-teknoloji-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mso-teknoloji-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: SENTOS_ENABLED
        value: "true"
      - key: SENTOS_BASE_URL
        sync: false
      - key: SENTOS_API_KEY
        sync: false
      - key: SENTOS_API_SECRET
        sync: false
      - key: SENTOS_WEBHOOK_SECRET
        sync: false
      - key: SENTOS_VERIFY_SSL
        value: "true"
